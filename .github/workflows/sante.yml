name: sante

# État des sources de SuiviMarché vu depuis GitHub : une requête minimale par API, chaque matin.
# Le run échoue quand une source ne répond pas (après un second essai) : GitHub envoie alors
# un courriel « Run failed » au propriétaire du dépôt. sante.json est publié dans tous les cas
# et lu par l'application (Paramètres › Sources et cache, colonne « Vu du relais »).

on:
  schedule:
    - cron: '10 6 * * *'   # tous les jours à 06:10 UTC (08:10 Paris en été)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sante
  cancel-in-progress: false

jobs:
  sante:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # tête de branche au démarrage du job, et non le commit du déclenchement (exécutions en file d'attente)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sondes
        id: sondes
        continue-on-error: true
        run: python sante.py
      - name: Publication
        run: |
          git config user.name 'relais-bot'
          git config user.email 'relais-bot@users.noreply.github.com'
          git add sante.json
          if git diff --cached --quiet; then echo 'Aucun changement'; exit 0; fi
          git commit -m "Santé des sources du $(date -u +%F)"
          # sante.json est régénéré en entier : en cas de conflit avec une publication intermédiaire, la version fraîche l'emporte (-X theirs)
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main && exit 0
            echo "publication refusée, nouvel essai $i"; git rebase --abort 2>/dev/null || true; sleep 15
          done
          exit 1
      - name: Sources en défaut
        if: steps.sondes.outcome == 'failure'
        run: |
          python -c "import json; d=json.load(open('sante.json')); [print('EN DEFAUT :', k, '-', r['lbl'], '-', r['msg']) for k, r in d['res'].items() if r['ok'] is False]"
          exit 1
